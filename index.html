<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Word Apps | AIと作る単語学習アプリ一覧</title>
    <meta
      name="description"
      content="AIと作った単語学習アプリシリーズ。英単語を学べる「AI英単語」、韓国語単語を学べる「AI韓国語単語」。画像・音声・例文・記憶度の見える化で、語彙学習を毎日の習慣に。"
    />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#001dff" />
    <meta property="og:title" content="AI Word Apps | AIと作る単語学習アプリ一覧" />
    <meta property="og:description" content="AIと作る単語学習アプリシリーズ。学びたい言語のアプリを選んでください。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aieitan.com/" />
    <meta property="og:image" content="https://aieitan.com/en/assets/audio-codex-icon.jpg" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="./en/assets/audio-codex-icon.jpg" />
    <link rel="canonical" href="https://aieitan.com/" />
    <style>
      :root {
        --ink: #0b1020;
        --muted: #667085;
        --accent: #001dff;
        --line: rgba(16, 24, 64, 0.1);
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, #ffffff 0%, #f5f7ff 55%, #eef1ff 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 56px 20px 40px;
        position: relative;
        word-break: keep-all;
        overflow-wrap: break-word;
      }

      /* ---------- animated background blobs ---------- */
      .bg-blob {
        position: fixed;
        z-index: 0;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.55;
        pointer-events: none;
        will-change: transform;
      }
      .bg-blob.b1 {
        top: -14%;
        left: -8%;
        width: 46vw;
        height: 46vw;
        max-width: 560px;
        max-height: 560px;
        background: radial-gradient(circle, #c7d2ff 0%, transparent 70%);
        animation: blobFloatA 26s ease-in-out infinite;
      }
      .bg-blob.b2 {
        top: 30%;
        right: -12%;
        width: 40vw;
        height: 40vw;
        max-width: 520px;
        max-height: 520px;
        background: radial-gradient(circle, #ffd9e6 0%, transparent 70%);
        animation: blobFloatB 32s ease-in-out infinite;
      }
      .bg-blob.b3 {
        bottom: -18%;
        left: 22%;
        width: 42vw;
        height: 42vw;
        max-width: 540px;
        max-height: 540px;
        background: radial-gradient(circle, #bdfcff 0%, transparent 70%);
        animation: blobFloatC 29s ease-in-out infinite;
      }
      @keyframes blobFloatA {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(4vw, 6vh) scale(1.12); }
      }
      @keyframes blobFloatB {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-5vw, 4vh) scale(1.08); }
      }
      @keyframes blobFloatC {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(3vw, -5vh) scale(1.1); }
      }

      /* ---------- header ---------- */
      .top { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; max-width: 720px; text-align: center; }

      .brand-mark {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 7px 15px 7px 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid var(--line);
        box-shadow: 0 8px 24px rgba(16, 24, 64, 0.06);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        margin-bottom: 22px;
        opacity: 0;
        animation: riseIn 0.7s ease forwards;
      }
      .brand-dot {
        position: relative;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, #001dff, #7c3aed, #ff5fa2, #001dff);
        animation: spin 5s linear infinite;
      }
      .brand-dot::after {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: 50%;
        background: #fff;
      }
      .brand-label {
        font-size: 12.5px;
        font-weight: 800;
        letter-spacing: 0.12em;
        color: #4b5568;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(28px, 5vw, 44px);
        line-height: 1.24;
        letter-spacing: -0.01em;
        opacity: 0;
        animation: riseIn 0.7s ease 0.08s forwards;
      }
      h1 .grad {
        background: linear-gradient(100deg, #001dff, #7c3aed 45%, #ff5fa2 90%);
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: gradShift 7s ease-in-out infinite;
      }

      .lead {
        color: var(--muted);
        margin: 0 0 8px;
        font-size: clamp(14.5px, 1.8vw, 16.5px);
        font-weight: 600;
        max-width: 480px;
        opacity: 0;
        animation: riseIn 0.7s ease 0.16s forwards;
      }

      .count-line {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin: 6px 0 40px;
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        opacity: 0;
        animation: riseIn 0.7s ease 0.22s forwards;
      }
      .count-line i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #20c35a;
        animation: dotPulse 1.8s ease-in-out infinite;
      }

      @keyframes riseIn {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes gradShift {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }
      @keyframes dotPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(32, 195, 90, 0.55); }
        50% { box-shadow: 0 0 0 6px rgba(32, 195, 90, 0); }
      }

      /* ---------- app grid ---------- */
      .app-grid {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        width: 100%;
        max-width: 760px;
      }

      .app-tile {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        text-decoration: none;
        color: inherit;
        padding: 30px 20px 26px;
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid var(--line);
        box-shadow: 0 10px 30px rgba(16, 24, 64, 0.06);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        opacity: 0;
        transform: translateY(18px);
        animation: tileIn 0.6s cubic-bezier(0.2, 0.8, 0.25, 1) forwards;
        animation-delay: calc(0.3s + var(--i) * 0.1s);
        transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.25, 1), box-shadow 0.35s ease, border-color 0.35s ease;
      }
      @keyframes tileIn {
        to { opacity: 1; transform: translateY(0); }
      }

      .app-tile:hover,
      .app-tile:focus-visible {
        transform: translateY(-8px) scale(1.02);
        border-color: color-mix(in srgb, var(--accent, #001dff) 35%, var(--line));
        box-shadow: 0 22px 44px rgba(16, 24, 64, 0.14), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
      }

      .app-badge {
        position: absolute;
        top: 14px;
        right: 14px;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(7, 16, 37, 0.9);
        color: #fff;
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.05em;
      }
      .app-badge i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #20c35a;
        animation: dotPulse 1.8s ease-in-out infinite;
      }

      .app-icon-wrap {
        position: relative;
        width: 84px;
        height: 84px;
        margin-bottom: 16px;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 10px 26px rgba(16, 24, 64, 0.18);
        transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.25, 1), box-shadow 0.35s ease;
      }
      .app-tile:hover .app-icon-wrap {
        transform: rotate(-4deg) scale(1.07);
        box-shadow: 0 16px 34px rgba(16, 24, 64, 0.26);
      }
      .app-icon {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .app-icon-shine {
        position: absolute;
        top: 0;
        left: -130%;
        width: 60%;
        height: 100%;
        background: linear-gradient(115deg, transparent, rgba(255, 255, 255, 0.75), transparent);
        transform: skewX(-18deg);
        transition: left 0.7s ease;
        pointer-events: none;
      }
      .app-tile:hover .app-icon-shine { left: 130%; }

      .app-flag {
        position: absolute;
        top: -6px;
        right: -6px;
        font-size: 20px;
        filter: drop-shadow(0 3px 6px rgba(16, 24, 64, 0.25));
      }

      .app-tile h2 {
        margin: 0 0 4px;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .app-tile p {
        margin: 0;
        color: var(--muted);
        font-size: 13.5px;
        font-weight: 600;
        line-height: 1.6;
      }
      .app-go {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-top: 16px;
        color: var(--accent, #001dff);
        font-weight: 700;
        font-size: 13px;
      }
      .app-go i {
        display: inline-block;
        font-style: normal;
        transition: transform 0.25s ease;
      }
      .app-tile:hover .app-go i { transform: translateX(4px); }

      /* ---------- coming soon tile ---------- */
      .app-tile-soon {
        border-style: dashed;
        background: rgba(255, 255, 255, 0.35);
        box-shadow: none;
        cursor: default;
      }
      .app-tile-soon:hover {
        transform: none;
        box-shadow: none;
        border-color: var(--line);
      }
      .app-icon-wrap.soon {
        display: grid;
        place-items: center;
        background: rgba(16, 24, 64, 0.04);
        box-shadow: none;
      }
      .app-icon-plus {
        font-size: 30px;
        font-weight: 300;
        color: rgba(16, 24, 64, 0.3);
        animation: softPulse 2.6s ease-in-out infinite;
      }
      @keyframes softPulse {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.12); }
      }
      .app-tile-soon h2 { color: rgba(16, 24, 64, 0.55); }
      .app-tile-soon p { color: rgba(16, 24, 64, 0.38); }

      footer {
        position: relative;
        z-index: 1;
        margin-top: 48px;
        color: #9aa3b5;
        font-size: 12px;
        text-align: center;
        opacity: 0;
        animation: riseIn 0.7s ease 0.8s forwards;
      }

      @media (max-width: 480px) {
        .app-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
        .app-tile { padding: 24px 14px 20px; border-radius: 22px; }
        .app-icon-wrap { width: 68px; height: 68px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .bg-blob,
        .brand-dot,
        h1 .grad,
        .count-line i,
        .app-badge i,
        .app-icon-plus,
        .app-tile,
        .brand-mark,
        h1,
        .lead,
        .count-line,
        footer {
          animation: none !important;
        }
        .app-tile { opacity: 1; transform: none; }
        .brand-mark, h1, .lead, .count-line, footer { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="bg-blob b1" aria-hidden="true"></div>
    <div class="bg-blob b2" aria-hidden="true"></div>
    <div class="bg-blob b3" aria-hidden="true"></div>

    <div class="top">
      <span class="brand-mark"><span class="brand-dot" aria-hidden="true"></span><span class="brand-label">AI Word Apps</span></span>
      <h1>学びたい言語の<br /><span class="grad">単語学習アプリ</span>を選んでください</h1>
      <p class="lead">画像・音声・例文・記憶度の見える化で覚える、買い切りの単語学習アプリシリーズ。</p>
      <p class="count-line"><i aria-hidden="true"></i>現在2アプリ配信中・今後も追加予定</p>
    </div>

    <div class="app-grid" id="appGrid" aria-label="アプリ一覧"></div>

    <footer>© 2026 AI Word Apps</footer>

    <script>
      // Data-driven app list — add a new object here when a new app ships.
      const apps = [
        {
          href: "/en/",
          icon: "./en/assets/audio-codex-icon.jpg",
          flag: "🇬🇧",
          name: "AI英単語",
          tagline: "4000語以上を、画像と音声で覚える。",
          accent: "#001dff",
        },
        {
          href: "/ko/",
          icon: "./ko/assets/audio-codex-icon.jpg",
          flag: "🇰🇷",
          name: "AI韓国語単語",
          tagline: "日常・旅行・推し活の約500語を、画像と音声で。",
          accent: "#e0492f",
          badge: "NEW",
        },
      ];

      const grid = document.getElementById("appGrid");

      const escapeHtml = (s) =>
        String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      grid.innerHTML =
        apps
          .map(
            (app, i) => `
        <a class="app-tile" href="${app.href}" style="--i:${i};--accent:${app.accent}">
          ${app.badge ? `<span class="app-badge"><i aria-hidden="true"></i>${escapeHtml(app.badge)}</span>` : ""}
          <span class="app-icon-wrap">
            <img class="app-icon" src="${app.icon}" alt="" loading="lazy" />
            <span class="app-icon-shine" aria-hidden="true"></span>
            <span class="app-flag" aria-hidden="true">${app.flag}</span>
          </span>
          <h2>${escapeHtml(app.name)}</h2>
          <p>${escapeHtml(app.tagline)}</p>
          <span class="app-go">開く <i aria-hidden="true">→</i></span>
        </a>`
          )
          .join("") +
        `
        <div class="app-tile app-tile-soon" style="--i:${apps.length}">
          <span class="app-icon-wrap soon"><span class="app-icon-plus" aria-hidden="true">+</span></span>
          <h2>Coming soon</h2>
          <p>次のAI単語アプリを準備中です。</p>
        </div>`;
    </script>
  </body>
</html>
